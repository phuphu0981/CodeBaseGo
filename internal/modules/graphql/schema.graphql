# Combined GraphQL Schema

type Query {
  """Get the currently authenticated user"""
  me: User!

  """Get paginated users (requires auth)"""
  users(page: Int, limit: Int): [User!]!

  """Get a user by ID (requires auth)"""
  user(id: ID!): User!
}

type Mutation {
  """Register a new user (public)"""
  register(input: RegisterInput!): TokenPair!

  """Login (public)"""
  login(input: LoginInput!): TokenPair!

  """Refresh access token (public)"""
  refreshToken(refresh_token: String!): TokenPair!

  """Logout / revoke refresh token (public)"""
  logout(refresh_token: String!): Message!

  """Logout from all devices (authenticated)"""
  logoutAll: Message!

  """Update a user by ID (requires auth)"""
  updateUser(id: ID!, input: UpdateUserInput!): User!

  """Delete a user by ID (requires auth)"""
  deleteUser(id: ID!): Message!
}

type Message {
  message: String!
}

type TokenPair {
  access_token: String!
  refresh_token: String!
  expires_in: Int!
  token_type: String!
}

input RegisterInput {
  email: String!
  password: String!
  name: String!
}

input LoginInput {
  email: String!
  password: String!
}

type User {
  id: ID!
  email: String!
  name: String!
  created_at: String!
  updated_at: String!
}

input UpdateUserInput {
  email: String
  name: String
  password: String
}
