basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: Access token expiration in seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        description: e.g. "Bearer"
        type: string
    type: object
  page.CreatePageRequest:
    properties:
      content:
        type: string
      slug:
        type: string
      status:
        type: string
      template:
        type: string
      title:
        type: string
    required:
    - slug
    - title
    type: object
  page.UpdatePageRequest:
    properties:
      content:
        type: string
      slug:
        type: string
      status:
        type: string
      template:
        type: string
      title:
        type: string
    type: object
  response.Body:
    properties:
      data: {}
      error:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  seo.CreateSEORequest:
    properties:
      canonical_url:
        type: string
      description:
        type: string
      keywords:
        type: string
      og_description:
        type: string
      og_image:
        type: string
      og_title:
        type: string
      og_type:
        type: string
      robots:
        type: string
      slug:
        type: string
      structured_data:
        type: string
      title:
        type: string
      twitter_card:
        type: string
    required:
    - slug
    - title
    type: object
  seo.UpdateSEORequest:
    properties:
      canonical_url:
        type: string
      description:
        type: string
      keywords:
        type: string
      og_description:
        type: string
      og_image:
        type: string
      og_title:
        type: string
      og_type:
        type: string
      robots:
        type: string
      slug:
        type: string
      structured_data:
        type: string
      title:
        type: string
      twitter_card:
        type: string
    type: object
  setting.SetConfigRequest:
    properties:
      path:
        type: string
      scope:
        type: string
      scope_id:
        type: string
      value:
        type: string
    required:
    - path
    type: object
  user.UpdateRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Modular Go + Gin Backend API (REST & GraphQL)
  title: CodebaseGo API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
      summary: Logout
      tags:
      - auth
  /auth/logout-all:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Logout from all devices
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      summary: Refresh Access Token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      summary: Register a new user
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Body'
      summary: Comprehensive health check
      tags:
      - health
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Liveness probe (Kubernetes /load balancer)
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Body'
      summary: Readiness probe (Kubernetes /load balancer)
      tags:
      - health
  /pages:
    get:
      parameters:
      - description: Opaque cursor for pagination
        in: query
        name: cursor
        type: string
      - default: 10
        description: Items per page for cursor pagination
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number for offset pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page for offset pagination
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: List pages
      tags:
      - pages
    post:
      consumes:
      - application/json
      parameters:
      - description: Page payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/page.CreatePageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Create page
      tags:
      - pages
  /pages/{id}:
    delete:
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Delete page
      tags:
      - pages
    get:
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get page by ID
      tags:
      - pages
    put:
      consumes:
      - application/json
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: string
      - description: Page update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/page.UpdatePageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Update page
      tags:
      - pages
  /pages/by-slug:
    get:
      parameters:
      - description: Page slug (e.g. 'home', 'about-us')
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get page by slug
      tags:
      - pages
  /pages/slugs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get list of published page slugs for SSG
      tags:
      - pages
  /seo:
    get:
      parameters:
      - description: Opaque cursor for pagination
        in: query
        name: cursor
        type: string
      - default: 10
        description: Items per page for cursor pagination
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number for offset pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page for offset pagination
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: List SEO records
      tags:
      - seo
    post:
      consumes:
      - application/json
      parameters:
      - description: SEO Metadata payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/seo.CreateSEORequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Create SEO record
      tags:
      - seo
  /seo/{id}:
    delete:
      parameters:
      - description: SEO Record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Delete SEO record
      tags:
      - seo
    get:
      parameters:
      - description: SEO Record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get SEO record by ID
      tags:
      - seo
    put:
      consumes:
      - application/json
      parameters:
      - description: SEO Record ID
        in: path
        name: id
        required: true
        type: string
      - description: SEO Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/seo.UpdateSEORequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Update SEO record
      tags:
      - seo
  /seo/by-slug:
    get:
      parameters:
      - description: Page slug (e.g. 'home', 'about-us', 'products/shoes')
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get SEO record by slug
      tags:
      - seo
  /settings:
    get:
      parameters:
      - description: Filter by path prefix (e.g. web/)
        in: query
        name: path_prefix
        type: string
      - description: Filter by scope
        in: query
        name: scope
        type: string
      - description: Opaque cursor for pagination
        in: query
        name: cursor
        type: string
      - default: 10
        description: Items per page for cursor pagination
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number for offset pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page for offset pagination
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: List system configurations
      tags:
      - settings
    post:
      consumes:
      - application/json
      parameters:
      - description: Config payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/setting.SetConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Set configuration value
      tags:
      - settings
  /settings/{id}:
    delete:
      parameters:
      - description: Config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Delete config by ID
      tags:
      - settings
    get:
      parameters:
      - description: Config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get config by ID
      tags:
      - settings
  /settings/by-path:
    get:
      parameters:
      - description: Config Path (e.g. web/unsecure/base_url)
        in: query
        name: path
        required: true
        type: string
      - default: default
        description: Scope
        in: query
        name: scope
        type: string
      - default: "0"
        description: Scope ID
        in: query
        name: scope_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get config by path
      tags:
      - settings
  /settings/public:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Get public system configs
      tags:
      - settings
  /users:
    get:
      parameters:
      - description: Opaque cursor for pagination
        in: query
        name: cursor
        type: string
      - default: 10
        description: Items per page for cursor pagination
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number for offset pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page for offset pagination
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
