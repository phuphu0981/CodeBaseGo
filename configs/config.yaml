server:
  port: "8080"
  mode: "debug"  # debug | release | test
  trusted_proxies:
    - "127.0.0.1"
    - "::1"


jwt:
  secret: "change-me-in-production"
  access_expire_minute: 15
  refresh_expire_day: 7

log:
  level: "debug"  # debug | info | warn | error

db:
  driver: "sqlite"
  dsn: "app.db"
  auto_migrate: true  # true: Local/Dev mode (GORM AutoMigrate) | false: Staging/Prod mode (use SQL migrations in ./migrations)

rate_limit:
  enabled: true
  rps: 20             # Số request tối đa mỗi giây cho mỗi IP
  burst: 40           # Dung lượng burst tối đa

# CORS Configuration
# Development: allow_origins = ["*"] cho phép tất cả
# Production:  chỉ liệt kê domain cụ thể của Frontend
cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allow_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
    - "X-Request-ID"
    - "X-Correlation-ID"
  allow_credentials: false  # Set true khi dùng cookie/session (không dùng được với origin "*")
  max_age: 86400            # Browser cache preflight request trong 24 giờ (giây)
